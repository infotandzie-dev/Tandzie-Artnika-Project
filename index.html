<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tandzie Artnika - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-speed: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111b21;
        }
        .iframe-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        iframe {
            /* Memperbesar ukuran asli iframe agar setelah diskala, isinya tetap memenuhi layar */
            width: 133.33%; /* 100 / 0.75 */
            height: 133.33%;
            border: 0;
            position: absolute;
            top: 0;
            left: 0;
            
            /* Mengatur tingkat mengecilkan tampilan (85%). Ubah nilai 0.85 jika ingin lebih kecil/besar */
            transform: scale(0.75);
            transform-origin: top left;
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbw6DvV2lWYgbAS0WZ9VWQPpC-cG3OIje67R57rByL57BBcdgFilJhSgCtkmu8z7B9lbSA/exec" 
            allow="fullscreen; geolocation; microphone; camera"
            sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
        </iframe>
    </div>

</body>
</html>
