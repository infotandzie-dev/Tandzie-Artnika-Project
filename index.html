<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tandzie Artnika - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #111b21;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
        }
        .login-card h2 {
            color: #0f766e;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .login-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #0d9488;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-login:hover {
            background-color: #0f766e;
        }
        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Tandzie Artnika</h2>
        <p>Project Management<br>Silakan login untuk mengakses dashboard.</p>
        
        <form>
            <div class="form-group">
                <label>Username</label>
                <input type="text" placeholder="Masukkan username">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Masukkan password">
            </div>
            
            <button type="submit" class="btn-login">Masuk ke Dashboard</button>
        </form>
        
        <div class="footer-text">
            Akses dilindungi autentikasi server. Simpan kredensial Anda dengan aman.
        </div>
    </div>

</body>
</html>
