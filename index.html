<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tandzie Artnika - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111b21;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
    <script>
        // Deteksi apakah perangkat yang membuka adalah HP / Tablet
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        var gasUrl = "https://script.google.com/macros/s/AKfycbxP4I9W2ENwPJ0_KeViTa4gHrGpqYRY6o_Apkisz6j8dkOodeLaw8PD5TllmEYDjm_vWg/exec";

        if (isMobile) {
            // Jika di HP, langsung alihkan ke Web App Google Apps Script
            window.location.href = gasUrl;
        }
    </script>
</head>
<body>

    <!-- Tampilan iframe full screen khusus untuk PC / Laptop -->
    <iframe src="https://script.google.com/macros/s/AKfycbxP4I9W2ENwPJ0_KeViTa4gHrGpqYRY6o_Apkisz6j8dkOodeLaw8PD5TllmEYDjm_vWg/exec" allow="fullscreen"></iframe>

</body>
</html>
