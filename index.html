<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tandzie Artnika - Project Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111b21;
        }
        /* Memaksa iframe atau container bawaan Google Apps Script agar jadi full layar */
        iframe, object, embed, .gas-container {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }
    </style>
</head>
<body>

    <!-- Masukkan link Web App Google Apps Script Anda di dalam iframe di bawah ini -->
    <iframe src="GANTI_DENGAN_URL_WEB_APP_APPS_SCRIPT_ANDA" allow="fullscreen"></iframe>

</body>
</html>
